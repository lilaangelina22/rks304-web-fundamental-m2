<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - AdminHub</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="validasi_input.js" defer></script>
</head>

<body class="bg-pink-50 min-h-screen py-10 px-4 text-gray-700">

    <div class="max-w-2xl mx-auto">

        <div class="text-center mb-8">

            <div class="w-14 h-14 mx-auto mb-4 bg-pink-500 text-white rounded-xl flex items-center justify-center text-2xl font-bold">
                A
            </div>

            <h1 class="text-3xl font-bold text-pink-900">
                Register
            </h1>

            <p class="text-gray-500 mt-2">
                Buat akun baru untuk mengakses AdminHub
            </p>

        </div>

        <div class="bg-white border border-pink-200 rounded-2xl shadow-lg p-8">

            <form
                id="registerForm"
                action="dashboard.html"
                method="get"
            >

                <div class="mb-5">

                    <label
                        for="username"
                        class="block text-sm font-semibold mb-2"
                    >
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Masukkan username"
                        class="w-full px-4 py-3 rounded-lg border border-pink-200 bg-white focus:outline-none focus:ring-2 focus:ring-pink-300"
                    >

                    <p
                        id="usernameError"
                        class="text-red-500 text-sm mt-1"
                    ></p>

                </div>

                <div class="mb-5">

                    <label
                        for="password"
                        class="block text-sm font-semibold mb-2"
                    >
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Minimal 8 karakter"
                        class="w-full px-4 py-3 rounded-lg border border-pink-200 bg-white focus:outline-none focus:ring-2 focus:ring-pink-300"
                    >

                    <p
                        id="passwordError"
                        class="text-red-500 text-sm mt-1"
                    ></p>

                </div>

                <div class="mb-5">

                    <label
                        for="nama"
                        class="block text-sm font-semibold mb-2"
                    >
                        Nama
                    </label>

                    <input
                        type="text"
                        id="nama"
                        name="nama"
                        placeholder="Masukkan nama lengkap"
                        class="w-full px-4 py-3 rounded-lg border border-pink-200 bg-white focus:outline-none focus:ring-2 focus:ring-pink-300"
                    >

                    <p
                        id="namaError"
                        class="text-red-500 text-sm mt-1"
                    ></p>

                </div>

                <div class="mb-5">

                    <label
                        for="tanggalLahir"
                        class="block text-sm font-semibold mb-2"
                    >
                        Tanggal Lahir
                    </label>

                    <input
                        type="date"
                        id="tanggalLahir"
                        name="tanggalLahir"
                        class="w-full px-4 py-3 rounded-lg border border-pink-200 bg-white focus:outline-none focus:ring-2 focus:ring-pink-300"
                    >

                    <p
                        id="tanggalLahirError"
                        class="text-red-500 text-sm mt-1"
                    ></p>

                </div>

                <div class="mb-5">

                    <label
                        for="alamat"
                        class="block text-sm font-semibold mb-2"
                    >
                        Alamat
                    </label>

                    <textarea
                        id="alamat"
                        name="alamat"
                        rows="4"
                        placeholder="Masukkan alamat lengkap"
                        class="w-full px-4 py-3 rounded-lg border border-pink-200 bg-white focus:outline-none focus:ring-2 focus:ring-pink-300"
                    ></textarea>

                    <p
                        id="alamatError"
                        class="text-red-500 text-sm mt-1"
                    ></p>

                </div>

                <div class="mb-6">

                    <label
                        for="telepon"
                        class="block text-sm font-semibold mb-2"
                    >
                        Nomor Telepon
                    </label>

                    <input
                        type="tel"
                        id="telepon"
                        name="telepon"
                        placeholder="Contoh: 628123456789"
                        class="w-full px-4 py-3 rounded-lg border border-pink-200 bg-white focus:outline-none focus:ring-2 focus:ring-pink-300"
                    >

                    <p
                        id="teleponError"
                        class="text-red-500 text-sm mt-1"
                    ></p>

                </div>

                <button
                    type="submit"
                    class="w-full bg-pink-500 hover:bg-pink-600 text-white py-3 rounded-lg font-semibold transition"
                >
                    Register
                </button>

            </form>

            <div class="text-center mt-6">

                <p class="text-sm text-gray-500">
                    Sudah memiliki akun?

                    <a
                        href="index.html"
                        class="text-pink-600 hover:text-pink-800 font-semibold"
                    >
                        Login
                    </a>
                </p>

            </div>

        </div>

    </div>

</body>
</html>
