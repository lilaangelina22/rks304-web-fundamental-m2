<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Admin</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-pink-50 min-h-screen flex items-center justify-center text-gray-700">

    <div class="w-full max-w-md bg-white border border-pink-200 rounded-2xl shadow-lg p-8">

        <div class="text-center mb-8">
            <div class="w-14 h-14 mx-auto mb-4 bg-pink-500 text-white rounded-xl flex items-center justify-center text-2xl font-bold">
                A
            </div>

            <h1 class="text-3xl font-bold text-pink-900">
                Admin
            </h1>

            <p class="text-gray-500 mt-2">
                Login ke panel administrator
            </p>
        </div>

        <form action="dashboard.html">

            <div class="mb-5">
                <label class="block text-sm font-semibold mb-2 text-gray-700">
                    Username
                </label>

                <input
                    type="text"
                    placeholder="Masukkan username"
                    required
                    class="w-full px-4 py-3 rounded-lg border border-pink-200 bg-white focus:outline-none focus:ring-2 focus:ring-pink-300"
                >
            </div>

            <div class="mb-6">
                <label class="block text-sm font-semibold mb-2 text-gray-700">
                    Password
                </label>

                <input
                    type="password"
                    placeholder="Masukkan password"
                    required
                    class="w-full px-4 py-3 rounded-lg border border-pink-200 bg-white focus:outline-none focus:ring-2 focus:ring-pink-300"
                >
            </div>

            <button
                type="submit"
                class="w-full bg-pink-500 hover:bg-pink-600 text-white py-3 rounded-lg font-semibold transition"
            >
                Login
            </button>

        </form>

    </div>

</body>
</html>
