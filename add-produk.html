<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Produk - Admin</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-pink-50 text-gray-700">

    <aside class="fixed left-0 top-0 w-64 h-screen bg-pink-100 border-r border-pink-200 p-5">

        <div class="flex items-center gap-3 mb-8">

            <div class="w-10 h-10 bg-pink-500 text-white rounded-lg flex items-center justify-center font-bold">
                A
            </div>

            <h1 class="text-xl font-bold text-pink-900">
                Admin
            </h1>

        </div>

        <nav class="space-y-2">

            <a href="dashboard.html"
               class="block px-4 py-3 rounded-lg hover:bg-pink-200 transition">
                Dashboard
            </a>

            <a href="products.html"
               class="block px-4 py-3 rounded-lg bg-pink-200 text-pink-900 font-semibold">
                Products
            </a>

            <a href="users.html"
               class="block px-4 py-3 rounded-lg hover:bg-pink-200 transition">
                Users
            </a>

            <a href="setting.html"
               class="block px-4 py-3 rounded-lg hover:bg-pink-200 transition">
                Setting
            </a>

            <a href="index.html"
               class="block px-4 py-3 rounded-lg hover:bg-pink-200 transition">
                Logout
            </a>

        </nav>

    </aside>


    <header class="ml-64 h-16 bg-white border-b border-pink-200 flex items-center justify-between px-8">

        <h2 class="font-semibold text-pink-900">
            Admin Dashboard
        </h2>

        <span class="text-sm text-gray-500">
            Admin
        </span>

    </header>


    <main class="ml-64 p-8">

        <div class="mb-8">

            <h1 class="text-3xl font-bold text-pink-900">
                Add Produk
            </h1>

            <p class="text-gray-500 mt-1">
                Tambahkan produk baru ke dalam daftar.
            </p>

        </div>


        <div class="bg-white border border-pink-200 rounded-xl shadow-sm p-6 max-w-3xl">

            <form action="products.html">

                <div class="mb-5">

                    <label class="block text-sm font-semibold mb-2">
                        Name
                    </label>

                    <input
                        type="text"
                        placeholder="Nama produk"
                        required
                        class="w-full px-4 py-3 rounded-lg border border-pink-200 bg-white focus:outline-none focus:ring-2 focus:ring-pink-300"
                    >

                </div>


                <div class="mb-5">

                    <label class="block text-sm font-semibold mb-2">
                        Stock
                    </label>

                    <input
                        type="number"
                        placeholder="Jumlah stock"
                        required
                        class="w-full px-4 py-3 rounded-lg border border-pink-200 bg-white focus:outline-none focus:ring-2 focus:ring-pink-300"
                    >

                </div>

                <div class="mb-6">

                    <label class="block text-sm font-semibold mb-2">
                        Description
                    </label>

                    <textarea
                        rows="5"
                        placeholder="Deskripsi produk"
                        class="w-full px-4 py-3 rounded-lg border border-pink-200 bg-white focus:outline-none focus:ring-2 focus:ring-pink-300"
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="bg-pink-500 hover:bg-pink-600 text-white px-6 py-3 rounded-lg font-semibold transition"
                >
                    Submit
                </button>

                <a
                    href="products.html"
                    class="ml-3 text-pink-600 hover:text-pink-800 font-semibold"
                >
                    Cancel
                </a>

            </form>

        </div>

    </main>


    <!-- FOOTER -->
    <footer class="ml-64 bg-white border-t border-pink-200 px-8 py-4 text-sm text-gray-500">
        © Dashboard Lila_2026
    </footer>

</body>
</html>
